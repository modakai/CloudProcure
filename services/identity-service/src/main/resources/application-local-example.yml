# 实际依赖必须显式提供；缺配置就失败，禁止回退到内存数据库或默认密码。
spring:
  config:
    import: nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
    sentinel:
      enabled: false
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USERNAME}
    password: ${IDENTITY_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

# 单实例登录尝试额度；与成功/失败无关，变更后重启 identity 生效。
identity:
  login-rate-limit:
    account-attempts: 5
    account-window: PT5M
    source-attempts: 30
    source-window: PT1M
    # 每个维度的最大键数；容量耗尽时拒绝新键，避免主动淘汰导致绕过限速。
    max-entries: 10000
