# 实际依赖必须显式提供；缺配置就失败，禁止回退到内存数据库或默认密码。
spring:
  config:
    import: nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
    sentinel:
      enabled: false
  data:
    redis:
      # 登录限速的共享计数存储；REDIS_PASSWORD 由进程环境或 Secret 注入。
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # 阻塞调用必须有界，Redis 故障时 fail-closed 返回 503。
      timeout: 2s
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USERNAME}
    password: ${IDENTITY_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

cloudprocure:
  rate-limit:
    # 环境段用于隔离不同环境；应用段默认取 spring.application.name。
    environment: local
    default-algorithm: FIXED_WINDOW
    log-decisions: true

# 登录尝试额度由 Redis 原子计数共享；与成功/失败无关，变更后全实例需使用同一规则。
identity:
  login-rate-limit:
    account-attempts: 5
    account-window: PT5M
    source-attempts: 30
    source-window: PT1M
