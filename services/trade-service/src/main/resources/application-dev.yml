# 实际依赖必须显式提供；缺配置就失败，禁止回退到内存数据库或默认密码。
spring:
  config:
    import: nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
    sentinel:
      enabled: false
  datasource:
    url: ${TRADE_DB_URL}
    username: ${TRADE_DB_USERNAME}
    password: ${TRADE_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          jwk-set-uri: ${OIDC_JWK_SET_URI}
          audiences: cloudprocure-api
