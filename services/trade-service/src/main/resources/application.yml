# 默认 local 模式；需要本机 Nacos/MySQL 等真实依赖，缺配置时启动失败。
spring:
  application:
    name: trade-service
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9103}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
